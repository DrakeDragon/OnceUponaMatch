  /* ---------- step playback ---------- */
  async function playSteps(steps) {
    for (const st of steps) { await playStep(st); await wait(60); }
  }
  async function playStep(step) {
    if (step.type === 'shuffle') {
      toast('The tiles are shuffling…'); const d = applySnapshot(step.grid, { shuffle: true }); await wait(d * 1000 + 150);
      applyHud(step); return;
    }
    const c = G.cell, boardRect = $('#board').getBoundingClientRect();
    if (step.created.length) S.sfx.special();
    if (step.fx.some(f => f.type === 'row' || f.type === 'col' || f.type === 'bomb' || f.type === 'rainbow')) S.sfx.blast();
    S.sfx.pop(step.cascade);
    step.fx.forEach(doFx);
    let cx = 0, cy = 0, n = 0, ghosts = { collect: 0, dust: 0 };
    const hasGoal = {}; G.state.goals.forEach(g => { if (g.type === 'collect') hasGoal[g.tile] = true; });
    for (const rm of step.removed) {
      const el = G.tiles.get(rm.id); if (!el) continue;
      G.tiles.delete(rm.id); el.classList.add('pop'); setTimeout(() => el.remove(), 340);
      const x = (rm.c + 0.5) * c, y = (rm.r + 0.5) * c; cx += x; cy += y; n++;
      const col = D.TILE_COLORS[rm.t >= 0 ? rm.t : 0].c1; sparkBurst(x, y, col, 3);
      if (rm.t >= 0 && hasGoal[rm.t] && ghosts.collect < 5) {
        const chip = $('.goal[data-k="collect:' + rm.t + '"]'); if (chip && !chip.classList.contains('done')) { ghosts.collect++; flyGhost(G.world.tiles[rm.t].e, boardRect.left + x, boardRect.top + y, chip); }
      }
    }
    if (n) floaty(cx / n, cy / n, '+' + step.scoreGain);
    for (const d of step.dustCleared) {
      const el = G.dustEls[d[0]] && G.dustEls[d[0]][d[1]]; if (!el) continue;
      if (d[2] > 0) el.classList.remove('l2'); else { el.classList.add('gone'); G.dustEls[d[0]][d[1]] = null; setTimeout(() => el.remove(), 650); }
      if (ghosts.dust < 3) { const chip = $('.goal[data-k="dust"]'); if (chip && !chip.classList.contains('done')) { ghosts.dust++; flyGhost('✨', boardRect.left + (d[1] + 0.5) * c, boardRect.top + (d[0] + 0.5) * c, chip); } }
    }
    if (step.cascade >= 2) showCheer(D.CHEERS[Math.min(D.CHEERS.length - 1, step.cascade - 2)]);
    else if (step.created.length && !step.fx.length) showCheer(D.CHEERS[3]);
    await wait(250);
    for (const rs of step.rescued) {
      const el = G.tiles.get(rs.id); if (!el) continue;
      G.tiles.delete(rs.id); place(el, rs.r, rs.c, false, 0.35); S.sfx.rescue();
      setTimeout(() => el.classList.add('rescue'), 330); setTimeout(() => el.remove(), 1000);
      const chip = $('.goal[data-k="items"]'); if (chip) flyGhost(G.world.item.e, boardRect.left + (rs.c + 0.5) * c, boardRect.top + (rs.r + 0.5) * c, chip);
    }
    if (step.rescued.length) { showCheer('Safe and sound!'); await wait(450); }
    const dur = applySnapshot(step.grid);
    await wait(dur * 1000 + 90);
    applyHud(step);
  }

  /* ---------- input ---------- */
  function cellAt(ev) {
    const rect = $('#board').getBoundingClientRect(), L = G.level;
    const c = Math.floor((ev.clientX - rect.left) / G.cell), r = Math.floor((ev.clientY - rect.top) / G.cell);
    return (r < 0 || c < 0 || r >= L.rows || c >= L.cols) ? null : { r: r, c: c };
  }
  const adjacent = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  function select(p) { deselect(); const el = tileAt(p); if (el) { el.classList.add('sel'); G.sel = p; } }
  function deselect() { $$('.tile.sel').forEach(e => e.classList.remove('sel')); G.sel = null; }
  function bindBoard() {
    const b = $('#board');
    b.addEventListener('pointerdown', ev => {
      S.init(); if (G.busy || !G.active) return;
      const p = cellAt(ev); if (!p) return;
      G.ptr = { p: p, x: ev.clientX, y: ev.clientY, done: false };
      try { b.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    });
    b.addEventListener('pointermove', ev => {
      const q = G.ptr; if (!q || q.done || G.aim || G.busy) return;
      const dx = ev.clientX - q.x, dy = ev.clientY - q.y;
      if (Math.hypot(dx, dy) < G.cell * 0.3) return;
      q.done = true;
      const horiz = Math.abs(dx) > Math.abs(dy);
      const nb = { r: q.p.r + (horiz ? 0 : (dy > 0 ? 1 : -1)), c: q.p.c + (horiz ? (dx > 0 ? 1 : -1) : 0) };
      if (nb.r < 0 || nb.c < 0 || nb.r >= G.level.rows || nb.c >= G.level.cols) return;
      deselect(); trySwap(q.p, nb);
    });
    const up = () => { const q = G.ptr; G.ptr = null; if (!q || q.done || G.busy || !G.active) return; tap(q.p); };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', () => { G.ptr = null; });
  }
  function tap(p) {
    if (G.aim) { aimTap(p); return; }
    clearHints(); resetIdle();
    if (G.sel) {
      if (G.sel.r === p.r && G.sel.c === p.c) { deselect(); return; }
      if (adjacent(G.sel, p)) { const a = G.sel; deselect(); trySwap(a, p); return; }
    }
    select(p); S.sfx.select();
  }

  /* ---------- actions ---------- */
  function pushUndo() { G.undo.push({ state: E.serialize(G.state) }); if (G.undo.length > 300) G.undo.shift(); }
  function swapVisual(ea, eb, a, b) {
    ea.classList.add('swapping'); eb.classList.add('swapping');
    place(ea, b.r, b.c, false, 0.17); place(eb, a.r, a.c, false, 0.17);
  }
  async function trySwap(a, b) {
    if (G.busy || !G.active) return;
    G.busy = true; clearHints(); clearTimeout(G.idleT);
    const ea = tileAt(a), eb = tileAt(b);
    if (!ea || !eb) { G.busy = false; return; }
    const info = E.moveInfo(G.state, a, b);
    S.sfx.swap(); swapVisual(ea, eb, a, b); await wait(190);
    if (!info.valid) {
      swapVisual(ea, eb, b, a); S.sfx.nope(); ea.classList.add('shake'); eb.classList.add('shake'); await wait(220);
      [ea, eb].forEach(e => { e.classList.remove('swapping'); e.classList.remove('shake'); place(e, e._r, e._c, true); });
      G.busy = false; resetIdle(); return;
    }
    ea.classList.remove('swapping'); eb.classList.remove('swapping');
    pushUndo();
    const res = E.swapMove(G.state, a, b);
    setMoves();
    await playSteps(res.steps);
    await afterAction();
  }
  async function afterAction() {
    applyHud(); setMoves();
    const st = E.status(G.state);
    if (st === 'won') { await onWin(); return; }
    if (st === 'lost') { await onLose(); return; }
    autosave(); G.busy = false; resetIdle();
  }
  function autosave() { save.resume = { n: G.n, state: E.serialize(G.state) }; persist(); }

  function undo() {
    if (G.busy || !G.active || !G.undo.length) return;
    const snap = G.undo.pop(); G.state = E.deserialize(snap.state); S.sfx.tap();
    renderFull(); applyHud(); setMoves(); autosave(); resetIdle();
  }

  /* hints */
  function showHint(manual) {
    clearHints(); if (G.busy || !G.active) return;
    const m = E.bestMove(G.state); if (!m) return;
    [m.a, m.b].forEach(p => { const el = tileAt(p); if (el) { el.classList.add('hint'); G.hintEls.push(el); } });
    if (G.n <= 3) {
      const f = $('#finger'), c = G.cell, s = f.style;
      s.setProperty('--fx0', ((m.a.c + 0.5) * c - c * 0.4) + 'px'); s.setProperty('--fy0', ((m.a.r + 0.5) * c - c * 0.1) + 'px');
      s.setProperty('--fx1', ((m.b.c + 0.5) * c - c * 0.4) + 'px'); s.setProperty('--fy1', ((m.b.r + 0.5) * c - c * 0.1) + 'px'); f.classList.add('on');
    }
    if (manual) S.sfx.select();
  }
  function clearHints() { G.hintEls.forEach(el => el.classList.remove('hint')); G.hintEls = []; const f = $('#finger'); if (f) f.classList.remove('on'); }
  function resetIdle() {
    clearTimeout(G.idleT);
    if (!save.settings.hints && G.n > 3) return;
    G.idleT = setTimeout(() => { if (!G.busy && G.active && !$('.modal-back')) showHint(false); }, G.n <= 3 ? 3500 : 9000);
  }

  /* powers: companions + wand */
  function onPower(b) {
    S.init(); if (G.busy || !G.active) return; S.sfx.tap();
    const s = G.state;
    if (G.aim) { const prev = G.aim.i; stopAim(); if (b.dataset.i !== undefined && +b.dataset.i === prev) return; }
    if (b.dataset.p === 'wand') {
      if (s.wand < s.wandNeed) { toast('The wand fills up as you clear tiles. ' + (s.wandNeed - s.wand) + ' more to go!'); return; }
      castWand(); return;
    }
    const i = +b.dataset.i, cmp = G.world.comps[i];
    if (s.charge[i] < s.chargeNeed) { toast(cmp.n + ' wakes up after ' + (s.chargeNeed - s.charge[i]) + ' more ' + G.world.tiles[cmp.t].n + ' tiles.'); return; }
    startAim(i);
  }
  async function castWand() {
    G.busy = true; clearHints(); pushUndo();
    const res = E.wandCast(G.state);
    if (!res.valid) { G.undo.pop(); G.busy = false; toast('Nothing to wish for just now!'); return; }
    S.sfx.wand(); showCheer('Make a wish!');
    await playSteps(res.steps); await afterAction();
  }
  function startAim(i) {
    deselect(); clearHints(); const cmp = G.world.comps[i], pow = E.COMP_POWERS[i];
    G.aim = { i: i, cell: null };
    $$('#g-powers .power').forEach(b => b.classList.toggle('aiming', b.dataset.i == i));
    $('#aim-banner span').innerHTML = '<b>' + cmp.n + '</b> ' + D.POWER_TEXT[pow] + '. Tap a tile to see, tap it again to use.';
    $('#aim-banner').classList.add('on'); $('.utils').style.display = 'none';
  }
  function stopAim() {
    G.aim = null; $$('.tile.aim').forEach(e => e.classList.remove('aim')); $$('#g-powers .power').forEach(b => b.classList.remove('aiming'));
    $('#aim-banner').classList.remove('on'); $('.utils').style.display = ''; resetIdle();
  }
  function aimCells(i, p) {
    const s = G.state, out = [], L = G.level, kind = E.COMP_POWERS[i], cell = s.grid[p.r][p.c];
    if (kind === 'row') { for (let c = 0; c < L.cols; c++) out.push({ r: p.r, c: c }); }
    else if (kind === 'burst') { for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (Math.abs(dr) + Math.abs(dc) <= 2) { const r = p.r + dr, c = p.c + dc; if (r >= 0 && r < L.rows && c >= 0 && c < L.cols) out.push({ r: r, c: c }); } }
    else if (cell && !cell.item) { const t = cell.t >= 0 ? cell.t : -99; for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) { const q = s.grid[r][c]; if (q && !q.item && q.t === t) out.push({ r: r, c: c }); } }
    return out;
  }
  async function aimTap(p) {
    const a = G.aim; if (!a) return;
    const cell = G.state.grid[p.r][p.c]; if (!cell) return;
    if (E.COMP_POWERS[a.i] === 'color' && cell.item) { toast('Pick a tile, not a friend!'); return; }
    if (a.cell && a.cell.r === p.r && a.cell.c === p.c) {
      const i = a.i; stopAim(); G.busy = true; pushUndo();
      const res = E.companionPower(G.state, i, p.r, p.c);
      if (!res.valid) { G.undo.pop(); G.busy = false; return; }
      showCheer(G.world.comps[i].n.replace(/^The /, '') + '!'); await playSteps(res.steps); await afterAction(); return;
    }
    a.cell = p; $$('.tile.aim').forEach(e => e.classList.remove('aim'));
    aimCells(a.i, p).forEach(q => { const el = tileAt(q); if (el) el.classList.add('aim'); }); S.sfx.select();
  }

  /* =========================================================
     LEVEL FLOW
     ========================================================= */
  async function tipModal(key) {
    if (save.seen['tip_' + key]) return; save.seen['tip_' + key] = 1; persist();
    const t = D.TIPS[key];
    await modal('<div class="eyebrow">Fairy tip</div><div class="big-emoji">' + t.e + '</div><h2>' + t.t + '</h2><p>' + t.b + '</p>' + btn('ok', 'Got it!', 'gold'));
  }
  async function storyModal() {
    const c = G.chapter, W = G.world;
    await modal('<div class="eyebrow">Chapter ' + (c + 1) + (c >= NW ? ' · again' : '') + '</div><h2>' + W.name + '</h2><div class="scene mini">' + chapterScene(c, { full: true }) + '</div><p>' + W.story + '</p>' + btn('ok', 'Begin the story', 'primary'));
  }
  async function compModal(i) {
    const W = G.world, cm = W.comps[i], pow = E.COMP_POWERS[i];
    S.sfx.gift();
    await modal('<div class="eyebrow">A new friend!</div><div class="big-emoji">' + cm.e + '</div><h2>' + cm.n + '</h2><p><i>' + cm.line + '</i></p><p>Clear <b>' + G.state.chargeNeed + ' ' + W.tiles[cm.t].e + ' ' + W.tiles[cm.t].n + '</b> tiles to wake them up. Then tap their picture and they’ll ' + (pow === 'row' ? 'sweep away a whole row' : pow === 'burst' ? 'burst a big patch of tiles' : 'clear every tile of one kind') + '.</p>' + btn('ok', 'Welcome!', 'gold'));
  }
  async function introModal() {
    const goals = G.state.goals.map(g => { const gi = goalInfo(g); return '<div class="mgoal"><span class="gi">' + gi.e + '</span><span>' + gi.t + '</span></div>'; }).join('');
    return modal('<div class="eyebrow">Chapter ' + (G.chapter + 1) + ' · ' + G.world.name + '</div><h2>Level ' + G.n + '</h2><div class="modal-goals" style="flex-direction:column;align-items:stretch">' + goals + '</div><p>You have <b>' + G.state.movesLeft + ' moves</b>. No rush!</p><div class="btns">' + btn('play', 'Play!', 'primary') + btn('back', 'Back', 'ghost') + '</div>');
  }
  async function startLevel(n, opts) {
    opts = opts || {};
    S.init(); clearTimeout(G.idleT);
    G.n = n; G.level = E.makeLevel(n); G.chapter = chapterOf(n); G.world = D.WORLDS[worldIdx(G.chapter)]; G.local = localOf(n);
    G.comps = [0, 1, 2].map(i => G.local >= compUnlock(G.chapter, i));
    G.busy = true; G.active = false; G.aim = null; G.undo = []; G.sel = null;
    const app = $('#app'); app.style.setProperty('--bg1', G.world.bg[0]); app.style.setProperty('--bg2', G.world.bg[1]); app.style.setProperty('--accent', G.world.accent);
    $('#g-title').textContent = 'Level ' + n;
    $('#game').style.setProperty('--scene', 'url("data:image/svg+xml;utf8,' + encodeURIComponent(D.sceneSVG(worldIdx(G.chapter))) + '")');
    $('#aim-banner').classList.remove('on'); $('.utils').style.display = '';
    buildBoardDOM(); show('game'); await nextFrame();
    let state;
    if (opts.resume) state = E.deserialize(opts.resume.state);
    else {
      state = E.createState(G.level, { compTile: G.world.comps.map(c => c.t), wandStart: save.boost.wand });
      if (save.boost.wand) { save.boost.wand = false; persist(); }
    }
    G.state = state; renderGoals(); renderPowers(); renderFull(); applyHud(); setMoves(); updateSoundIcon();
    if (!opts.resume) {
      if (G.local === 1 && !save.seen['story' + G.chapter]) { save.seen['story' + G.chapter] = 1; persist(); await storyModal(); }
      for (let i = 0; i < 3; i++) if (G.local === compUnlock(G.chapter, i) && !save.seen['comp' + G.chapter + '_' + i]) { save.seen['comp' + G.chapter + '_' + i] = 1; persist(); await compModal(i); }
      if (n === 1) await tipModal('swap');
      if (n === 2) await tipModal('moves');
      if (G.level.wandUnlocked && n >= 6) await tipModal('wand');
      if (G.level.goals.some(g => g.type === 'dust')) await tipModal('dust');
      if (G.level.goals.some(g => g.type === 'items')) await tipModal('items');
      const a = await introModal();
      if (a === 'back') { G.chapView = chapterOf(n); renderChapters(); show('chapters'); return; }
    }
    G.active = true; G.busy = false; autosave(); resetIdle();
  }

  async function onWin() {
    G.busy = true; G.active = false; clearHints(); clearTimeout(G.idleT);
    const s = G.state, stars = E.starsFor(s), n = G.n, first = n >= save.top;
    S.sfx.win(); showCheer('Level complete!'); confetti(18);
    await wait(900);
    G.fast = true;
    let k = Math.min(6, s.movesLeft);
    while (k-- > 0 && s.movesLeft > 0) { s.movesLeft--; setMoves(); const res = E.bonusPop(s); if (!res.valid) break; await playSteps(res.steps); }
    G.fast = false; await wait(300);
    // record progress
    let piece = null, card = null;
    if (first) {
      piece = fogOrder(G.chapter)[G.local - 1]; save.top = n + 1; save.wins++;
      if (n % 5 === 0) card = awardCard(worldIdx(G.chapter));
    }
    save.stars[n] = Math.max(save.stars[n] || 0, stars); save.resume = null; persist();
    const c = G.chapter, done = Math.min(CL, Math.max(0, save.top - 1 - c * CL));
    const title = D.WIN_TITLES[Math.floor(Math.random() * D.WIN_TITLES.length)];
    let html = '<div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div><h2>' + title + '</h2><p>Score: <b>' + fmt(s.score) + '</b></p>';
    if (first) {
      html += '<div class="scene mini">' + chapterScene(c, { newly: piece }) + '</div><p class="reveal-note">🖼️ A piece of the picture is restored! <b>' + done + ' of ' + CL + '</b></p>';
      if (card) html += '<div class="new-card-row"><span class="em" style="font-size:2.2rem">' + card.e + '</span><span>New storybook card:<br><b>' + esc(card.n) + '</b></span></div>';
      else { const left = 5 - (n % 5); html += '<p class="reveal-note">🃏 ' + left + ' more level' + (left > 1 ? 's' : '') + ' until your next storybook card</p>'; }
    }
    html += '<div class="btns">' + btn('next', 'Next level  →', 'primary') + btn('map', '📖 Chapter map', 'ghost') + btn('again', '↻ Play this level again', 'ghost') + '</div>';
    const wp = modal(html, {
      onOpen(el) {
        const spans = $$('.stars span', el); spans.forEach((sp, i) => { if (i < stars) setTimeout(() => { sp.classList.add('on'); S.sfx.star(); }, 500 + i * 450); });
      },
    });
    const a = await wp;
    if (card) {
      const pg = (D.STORY_PAGES[worldIdx(G.chapter)] || [])[Math.max(0, Math.floor((G.local - 1) / 5))];
      S.sfx.gift(); confetti(24);
      await modal('<div class="eyebrow">You earned a storybook card!</div>' + cardHTML(card.id, true) + '<h3>' + esc(card.n) + '</h3>' +
        (pg ? '<div class="story-page"><div class="eyebrow">Story page ' + (Math.floor((G.local - 1) / 5) + 1) + ' of 6 · ' + esc(G.world.name) + '</div><p>' + esc(pg) + '</p></div>' : '') +
        '<p class="reveal-note">It’s saved in your 🃏 Cards.</p>' + btn('ok', 'Continue', 'primary'));
    }
    if (first && G.local === CL) {
      S.sfx.win(); confetti(40);
      await modal('<div class="eyebrow">Chapter ' + (c + 1) + ' complete</div><h2>' + G.world.name + '</h2><div class="scene mini">' + chapterScene(c, { full: true }) + '</div><p>' + G.world.epilogue + '</p>' + btn('ok', 'On to the next tale…', 'primary'));
    }
    if (a === 'next') startLevel(n + 1);
    else if (a === 'again') startLevel(n);
    else { G.chapView = chapterOf(Math.min(save.top, n + 1)); renderChapters(); show('chapters'); }
  }

  async function onLose() {
    G.busy = true; G.active = false; clearHints(); clearTimeout(G.idleT); S.sfx.lose();
    const s = G.state, left = 3 - (s.extraMoves || 0);
    const lines = s.goals.map(g => { const gi = goalInfo(g); const have = g.type === 'score' ? s.score : g.have; return '<div class="mgoal"><span class="gi">' + gi.e + '</span><span>' + (g.type === 'score' ? fmt(Math.min(have, g.need)) + ' of ' + fmt(g.need) : Math.min(have, g.need) + ' of ' + g.need) + '</span></div>'; }).join('');
    const a = await modal('<div class="big-emoji">🌙</div><h2>So close!</h2><p>You’re doing wonderfully. Here’s how far you got:</p><div class="modal-goals">' + lines + '</div><div class="btns">' + (left > 0 ? btn('extra', '✨ Add 5 moves — free!', 'primary') : '') + btn('retry', '↻ Try again', left > 0 ? 'ghost' : 'primary') + btn('map', '📖 Chapter map', 'ghost') + '</div>');
    if (a === 'extra') {
      s.extraMoves = (s.extraMoves || 0) + 1; s.movesLeft += 5; s.movesTotal += 5; setMoves(); autosave();
      G.active = true; G.busy = false; resetIdle(); toast('Five more moves — go on, you’ve got this!');
    } else if (a === 'retry') { save.resume = null; startLevel(G.n); }
    else { G.chapView = chapterOf(G.n); renderChapters(); show('chapters'); }
  }

  /* =========================================================
     BOOT
     ========================================================= */
  function boot() {
    document.documentElement.style.setProperty('--fs', save.settings.fs);
    const bg = $('#bgstars'); for (let i = 0; i < 22; i++) { const s = document.createElement('i'); s.className = 'bgstar'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.animationDelay = (Math.random() * 5) + 's'; s.style.animationDuration = (3 + Math.random() * 4) + 's'; bg.appendChild(s); }
    S.setSfx(save.settings.sfx); S.setMusic(save.settings.music);
    $('#game').innerHTML =
      '<div class="g-top"><button class="icon-btn" id="g-menu" aria-label="Menu">☰</button><div class="g-title"><small id="g-sub"></small><b id="g-title">Level 1</b></div><button class="icon-btn" id="g-sound" aria-label="Sound">🔊</button></div>' +
      '<div class="g-hud"><div class="moves"><b id="g-moves">0</b><small>MOVES</small></div><div class="goals" id="g-goals"></div></div>' +
      '<div class="g-main"><div id="board-wrap"><div id="board"></div><div id="board-msg"></div></div></div>' +
      '<div class="g-bottom"><div class="powers" id="g-powers"></div><div class="g-slot"><div class="utils"><button id="b-undo"><span>↶</span> Undo</button><button id="b-hint"><span>💡</span> Hint</button></div>' +
      '<div id="aim-banner"><span></span><button id="aim-cancel">Cancel</button></div></div></div>';
    $('#g-menu').onclick = () => { S.init(); S.sfx.tap(); openMenu(); };
    $('#g-sound').onclick = () => { S.init(); const on = save.settings.sfx || save.settings.music; save.settings.sfx = save.settings.music = !on; S.setSfx(!on); S.setMusic(!on); persist(); updateSoundIcon(); S.sfx.tap(); };
    $('#b-undo').onclick = undo;
    $('#b-hint').onclick = () => { S.init(); if (!G.busy && G.active) { resetIdle(); showHint(true); } };
    $('#aim-cancel').onclick = () => { S.sfx.tap(); stopAim(); };
    bindBoard();
    window.addEventListener('resize', () => { if ($('#game').classList.contains('active')) layoutBoard(); });
    window.addEventListener('orientationchange', () => setTimeout(() => { if ($('#game').classList.contains('active')) layoutBoard(); }, 250));
    document.addEventListener('pointerdown', () => S.init(), { once: true });
    renderHome(); show('home');
    window.__game = { applyHud: applyHud, setMoves: setMoves, renderFull: renderFull, G: G, get save() { return save; }, startLevel: startLevel, E: E, D: D, renderHome: renderHome, renderChapters: renderChapters, renderCards: renderCards, show: show, openSettings: openSettings, openGift: openGift, openMenu: openMenu, tap: tap, trySwap: trySwap, playSteps: playSteps, persist: persist, setSave(o) { save = Object.assign(defaults(), o); persist(); } };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
