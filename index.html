<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#1b1246">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Once Upon a Match">
<title>Once Upon a Match</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --fs: 1;
  --gold: #f6d77a; --gold2: #d9a93a; --gold3: #8a5a12;
  --ink: #34203f; --parch1: #fcf4dc; --parch2: #f0dfae;
  --cy: #4fe3ff; --mg: #ff5fd2; --violet: #2b1a55;
  --bg1: #0e3b32; --bg2: #1b1246; --accent: #7dffb2;
  --cell: 56px;
  --serif: 'Cormorant Garamond', 'Palatino Linotype', Palatino, Georgia, serif;
  --sans: 'Nunito', 'Avenir Next', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: calc(16px * var(--fs)); }
html, body { margin: 0; height: 100%; background: #120b2b; overscroll-behavior: none; }
body { font-family: var(--sans); color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow: hidden; }
button { font-family: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
b, strong { font-weight: 800; }

#app { position: fixed; inset: 0; background:
  radial-gradient(1200px 700px at 50% -10%, var(--bg1), transparent 70%),
  radial-gradient(900px 700px at 100% 110%, rgba(255, 95, 210, .22), transparent 60%),
  radial-gradient(900px 700px at 0% 110%, rgba(79, 227, 255, .18), transparent 60%),
  linear-gradient(180deg, var(--bg2), #0b0720); overflow: hidden; transition: background .6s; }
#bgstars { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bgstar { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: 0; animation: twinkle 5s ease-in-out infinite; box-shadow: 0 0 8px 2px rgba(255, 255, 255, .6); }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: .9; transform: scale(1.1); } }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transform: scale(.985); transition: opacity .35s, transform .35s, visibility 0s .35s; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .35s, transform .35s; }

/* ---------- generic buttons ---------- */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3.4rem; padding: .7rem 1.6rem; border-radius: 999px; font-weight: 800; font-size: 1.15rem; letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); transition: transform .08s, box-shadow .08s, filter .2s; }
.btn:active { transform: translateY(3px); }
.btn.primary { background: linear-gradient(180deg, #ff86e6, #c2269f 70%); border: 3px solid #ffe29a; color: #fff; box-shadow: 0 5px 0 #7d1566, 0 10px 22px rgba(255, 95, 210, .35); }
.btn.primary:active { box-shadow: 0 2px 0 #7d1566, 0 6px 14px rgba(255, 95, 210, .3); }
.btn.cyan { background: linear-gradient(180deg, #7aeeff, #0f93c4 70%); border: 3px solid #e6fbff; color: #fff; box-shadow: 0 5px 0 #0a5d80, 0 10px 22px rgba(79, 227, 255, .3); }
.btn.cyan:active { box-shadow: 0 2px 0 #0a5d80; }
.btn.gold { background: linear-gradient(180deg, #ffe58a, #d9a024 70%); border: 3px solid #fff3c4; color: #5a3a00; text-shadow: 0 1px 0 rgba(255, 255, 255, .5); box-shadow: 0 5px 0 #8a5a12, 0 10px 22px rgba(255, 210, 90, .3); }
.btn.ghost { background: rgba(255, 255, 255, .12); border: 2px solid rgba(255, 255, 255, .4); color: #fff; min-height: 3rem; font-size: 1rem; }
.btn.big { min-height: 4.2rem; font-size: 1.5rem; padding: .8rem 2.4rem; }
.btn.block { display: flex; width: 100%; }
.btn small { font-size: .8em; opacity: .9; font-weight: 700; }
.icon-btn { width: 3.2rem; height: 3.2rem; border-radius: 50%; background: rgba(255, 255, 255, .13); border: 2px solid rgba(255, 255, 255, .35); font-size: 1.4rem; display: grid; place-items: center; backdrop-filter: blur(4px); }
.icon-btn:active { transform: scale(.94); }

/* ---------- home ---------- */
#home { align-items: center; justify-content: center; padding-bottom: 1rem; text-align: center; }
.home-scroll { width: 100%; max-width: 520px; padding: 1rem 1.3rem; display: flex; flex-direction: column; align-items: center; gap: .9rem; overflow-y: auto; max-height: 100%; }
.home-pic { position: relative; width: 100%; aspect-ratio: 400 / 240; border-radius: 26px; overflow: hidden; border: 4px solid var(--gold2); box-shadow: 0 0 0 3px #4a2a10, 0 14px 30px rgba(0, 0, 0, .55), 0 0 40px rgba(246, 215, 122, .25); background: #000; }
.home-pic svg, .scene svg { display: block; width: 100%; height: 100%; }
.logo { margin: .2rem 0 0; font-family: var(--serif); font-weight: 700; line-height: .95; text-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 0 30px rgba(246, 215, 122, .45); }
.logo span { display: block; font-size: 1.7rem; letter-spacing: .2em; text-transform: uppercase; color: #ffe9a8; }
.logo b { display: block; font-size: 3.6rem; background: linear-gradient(180deg, #fff6c8, #f6c94a 60%, #d9902a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .4)); }
.greet { margin: 0; font-size: 1.15rem; color: #e8dcff; min-height: 1.4rem; }
.home-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; width: 100%; }
.home-row button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; padding: .7rem .2rem; min-height: 4.6rem; border-radius: 18px; background: rgba(255, 255, 255, .1); border: 2px solid rgba(255, 255, 255, .28); font-weight: 700; font-size: .85rem; }
.home-row button span { font-size: 1.6rem; line-height: 1; }
.home-row button:active { transform: scale(.96); }
.badge-dot { position: absolute; top: 6px; right: 10px; width: 14px; height: 14px; border-radius: 50%; background: #ff3d7f; border: 2px solid #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
.totals { font-size: .95rem; color: #d7c8ff; margin: 0; }

/* ---------- headers (chapters, cards) ---------- */
.sub-head { display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; }
.sub-head h2 { flex: 1; margin: 0; font-family: var(--serif); font-size: 1.8rem; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, .4); }
.sub-head .spacer { width: 3.2rem; }

/* ---------- chapters ---------- */
.chap-body { flex: 1; overflow-y: auto; padding: 0 1rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: .8rem; -webkit-overflow-scrolling: touch; }
.chap-pager { display: flex; align-items: center; gap: .6rem; width: 100%; max-width: 520px; }
.chap-pager .titles { flex: 1; text-align: center; }
.chap-pager small { display: block; letter-spacing: .15em; text-transform: uppercase; color: #cbb9ff; font-weight: 800; font-size: .75rem; }
.chap-pager b { font-family: var(--serif); font-size: 1.55rem; line-height: 1.1; }
.icon-btn[disabled] { opacity: .3; pointer-events: none; }
.scene { position: relative; width: 100%; max-width: 520px; aspect-ratio: 400 / 240; border-radius: 22px; overflow: hidden; border: 4px solid var(--gold2); box-shadow: 0 0 0 3px #4a2a10, 0 12px 26px rgba(0, 0, 0, .5); background: #000; }
.newpiece { animation: pieceIn 1.6s .7s ease-out both; }
.newflash { animation: flashout 1.4s .7s ease-out both; }
@keyframes pieceIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes flashout { from { opacity: 1; } to { opacity: 0; } }
.scene-count { font-size: .95rem; color: #e8dcff; margin: 0; }
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; width: 100%; max-width: 520px; }
.lvl { position: relative; aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; background: radial-gradient(circle at 35% 28%, #b9a6ff, #4b2fa8 70%); border: 3px solid #e3d8ff; box-shadow: 0 4px 0 #26136a, 0 6px 12px rgba(0, 0, 0, .35); }
.lvl .st { font-size: .6rem; letter-spacing: -.05em; color: #ffd44d; line-height: 1; margin-top: -.1rem; min-height: .6rem; }
.lvl.done { background: radial-gradient(circle at 35% 28%, #ffec9e, #d9902a 70%); border-color: #fff3c4; box-shadow: 0 4px 0 #7d4d0a, 0 6px 12px rgba(0, 0, 0, .35); color: #4a2d00; }
.lvl.now { background: radial-gradient(circle at 35% 28%, #ff9fe9, #c2269f 70%); border-color: #fff; animation: pulse 1.4s infinite; }
.lvl.locked { filter: grayscale(.9) brightness(.55); box-shadow: none; pointer-events: none; }
.lvl:active { transform: translateY(2px) scale(.97); }

/* ---------- cards ---------- */
.cards-wrap { flex: 1; overflow-y: auto; padding: 0 1rem 2rem; -webkit-overflow-scrolling: touch; }
.cards-inner { max-width: 560px; margin: 0 auto; }
.cards-world { margin: 1.2rem 0 .5rem; font-family: var(--serif); font-size: 1.45rem; display: flex; justify-content: space-between; align-items: baseline; }
.cards-world small { font-family: var(--sans); font-size: .85rem; color: #cbb9ff; }
.cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.card { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; padding: .5rem .3rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35rem; text-align: center; background: linear-gradient(160deg, #fff7dd, #f0d98f); color: var(--ink); border: 3px solid var(--gold2); box-shadow: 0 5px 12px rgba(0, 0, 0, .4), inset 0 0 0 2px #fff6; font-weight: 800; font-size: .78rem; line-height: 1.15; }
.card .em { font-size: 2.4rem; line-height: 1; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .3)); }
.card.hero { background: linear-gradient(160deg, #fff0ff, #e7b6ff); border-color: #c05fd0; }
.card.locked { background: linear-gradient(160deg, #2b2158, #1a1238); color: #8b7fc0; border-color: #4a3a8a; box-shadow: none; }
.card.locked .em { filter: grayscale(1) brightness(.2); opacity: .8; }
.card.fresh { animation: cardin .9s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes cardin { 0% { transform: scale(.3) rotate(-14deg); opacity: 0; } 100% { transform: none; opacity: 1; } }

/* ---------- game ---------- */
#game { align-items: stretch; isolation: isolate; }
#game::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: min(58%, 560px); z-index: -1; pointer-events: none; opacity: .55;
  background: var(--scene) center bottom / cover no-repeat; -webkit-mask-image: linear-gradient(to top, #000 45%, transparent); mask-image: linear-gradient(to top, #000 45%, transparent); }
.g-top { display: flex; align-items: center; justify-content: space-between; padding: .5rem .8rem 0; }
.g-title { text-align: center; line-height: 1.05; }
.g-title small { display: block; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: #cdbdff; font-weight: 800; }
.g-title b { font-family: var(--serif); font-size: 1.7rem; text-shadow: 0 2px 0 rgba(0, 0, 0, .4); }
.g-hud { display: flex; align-items: center; gap: .7rem; padding: .5rem .8rem 0; }
.moves { flex: 0 0 auto; width: 4.6rem; height: 4.6rem; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 28%, #ffec9e, #d9902a 75%); border: 3px solid #fff3c4; box-shadow: 0 4px 0 #7d4d0a, 0 8px 16px rgba(0, 0, 0, .35); color: #4a2d00; line-height: 1; }
.moves b { font-size: 1.9rem; }
.moves small { font-size: .62rem; letter-spacing: .12em; font-weight: 800; margin-top: .1rem; }
.moves.low { background: radial-gradient(circle at 35% 28%, #ff9a9a, #c0263a 75%); color: #fff; animation: pulse 1s infinite; }
.moves.bump b { animation: bump .35s; }
@keyframes bump { 50% { transform: scale(1.35); } }
.goals { flex: 1; display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; min-width: 0; }
.goal { display: flex; align-items: center; gap: .4rem; padding: .3rem .8rem .3rem .45rem; border-radius: 999px; background: rgba(0, 0, 0, .35); border: 2px solid rgba(255, 255, 255, .35); font-weight: 800; font-size: 1.15rem; min-height: 2.8rem; transition: background .3s, border-color .3s; }
.goal .gi { font-size: 1.6rem; line-height: 1; }
.goal .gt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.goal .gt em { font-style: normal; opacity: .7; font-weight: 700; }
.goal.done { background: rgba(60, 220, 130, .35); border-color: #8dffc0; }
.goal.done .gt::after { content: ' ✓'; color: #b9ffd8; }
.goal.bump { animation: bump .4s; }
.g-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: .5rem; }
#board-wrap { position: relative; padding: 9px; border-radius: 26px; background: linear-gradient(145deg, #ffe9a0, #d9a93a 40%, #9a6414 70%, #f3cf6a); box-shadow: 0 0 0 3px #3b2208, 0 14px 30px rgba(0, 0, 0, .55), 0 0 40px rgba(246, 215, 122, .18); }
#board { position: relative; width: calc(var(--cell) * var(--cols)); height: calc(var(--cell) * var(--rows)); border-radius: 18px; overflow: hidden; background: linear-gradient(180deg, rgba(20, 12, 50, .92), rgba(10, 6, 34, .96)); box-shadow: inset 0 0 22px rgba(0, 0, 0, .7); touch-action: none; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.bcell { position: absolute; width: var(--cell); height: var(--cell); }
.bcell.alt { background: rgba(255, 255, 255, .045); }
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); display: grid; place-items: center; transition: transform .3s cubic-bezier(.3, 1.25, .5, 1); will-change: transform; z-index: 2; }
.tile.nt { transition: none !important; }
.tile.swapping { transition: transform .17s ease-in-out; z-index: 4; }
.gem { position: relative; width: calc(100% - 7px); height: calc(100% - 7px); border-radius: 28%; display: grid; place-items: center; font-size: calc(var(--cell) * .5); line-height: 1; background: radial-gradient(circle at 30% 24%, rgba(255, 255, 255, .75), rgba(255, 255, 255, 0) 42%), linear-gradient(150deg, var(--g1), var(--g2)); box-shadow: inset 0 -5px 7px rgba(0, 0, 0, .28), inset 0 2px 3px rgba(255, 255, 255, .55), 0 3px 6px rgba(0, 0, 0, .4); transition: transform .15s, box-shadow .15s; }
.gem > span { filter: drop-shadow(0 2px 1.5px rgba(0, 0, 0, .4)); pointer-events: none; }
.c0 { --g1: #ffd65a; --g2: #e08a00; } .c1 { --g1: #ff7a86; --g2: #b3122e; } .c2 { --g1: #55e8a8; --g2: #0a8f5a; }
.c3 { --g1: #ff7fdc; --g2: #a3199b; } .c4 { --g1: #66e8ff; --g2: #0b7fb3; } .c5 { --g1: #b39bff; --g2: #5a2fc4; }
.gem.item { background: radial-gradient(circle at 30% 24%, #fff, rgba(255, 255, 255, 0) 45%), linear-gradient(150deg, #fffbe6, #f3d98a); border: 3px solid #fff; box-shadow: 0 0 16px 3px rgba(255, 240, 160, .85), inset 0 -4px 6px rgba(0, 0, 0, .15); animation: floaty 1.6s ease-in-out infinite; font-size: calc(var(--cell) * .58); }
@keyframes floaty { 50% { transform: translateY(-3px); } }
.gem.sp1, .gem.sp2, .gem.sp3 { box-shadow: 0 0 0 2px #fff, 0 0 14px 3px rgba(255, 255, 255, .9), inset 0 -5px 7px rgba(0, 0, 0, .25); animation: glow 1.3s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px #fff, 0 0 22px 7px rgba(255, 255, 255, 1), inset 0 -5px 7px rgba(0, 0, 0, .25); } }
.mark { position: absolute; inset: 0; border-radius: 28%; pointer-events: none; }
.sp1 .mark { background: repeating-linear-gradient(0deg, transparent 0 6px, rgba(255, 255, 255, .55) 6px 9px); -webkit-mask: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); mask: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }
.sp2 .mark { background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(255, 255, 255, .55) 6px 9px); -webkit-mask: linear-gradient(0deg, transparent, #000 20%, #000 80%, transparent); mask: linear-gradient(0deg, transparent, #000 20%, #000 80%, transparent); }
.sp1::after, .sp2::after { content: '↔'; position: absolute; right: -2px; top: -4px; font-size: calc(var(--cell) * .3); font-weight: 900; color: #fff; text-shadow: 0 0 5px #000, 0 0 8px #000; }
.sp2::after { content: '↕'; }
.sp3::after { content: '✸'; position: absolute; right: -3px; top: -5px; font-size: calc(var(--cell) * .38); color: #fff; text-shadow: 0 0 5px #000, 0 0 8px #ff8a00; }
.gem.sp4 { background: conic-gradient(from 0deg, #ff5f7e, #ffd65a, #55e8a8, #66e8ff, #b39bff, #ff7fdc, #ff5f7e); animation: spin 3s linear infinite, glow 1.3s ease-in-out infinite; box-shadow: 0 0 0 2px #fff, 0 0 16px 4px rgba(255, 255, 255, .95); }
.gem.sp4 > span { animation: spinback 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } } @keyframes spinback { to { transform: rotate(-360deg); } }
.tile.sel .gem { transform: scale(1.13); box-shadow: 0 0 0 3px #fff, 0 0 20px 7px rgba(255, 240, 150, .95), inset 0 -5px 7px rgba(0, 0, 0, .25); }
.tile.hint .gem { animation: hintb .8s ease-in-out infinite; }
@keyframes hintb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 18px 6px rgba(255, 240, 150, .9); } }
.tile.aim .gem { box-shadow: 0 0 0 3px #fff, 0 0 18px 6px rgba(255, 130, 230, .95); animation: hintb .7s ease-in-out infinite; }
.tile.pop { z-index: 3; pointer-events: none; }
.tile.pop .gem { animation: popout .27s ease-out forwards; }
@keyframes popout { 0% { transform: scale(1); filter: brightness(1); } 40% { transform: scale(1.28); filter: brightness(1.8); } 100% { transform: scale(0); opacity: 0; filter: brightness(2); } }
.tile.shake .gem { animation: shake .3s; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.tile.born .gem { animation: born .5s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes born { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
.tile.rescue .gem { animation: rescue .6s ease-in forwards; }
@keyframes rescue { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(8deg); } 100% { transform: scale(0) translateY(-40px); opacity: 0; } }
.dust { position: absolute; width: var(--cell); height: var(--cell); z-index: 5; pointer-events: none; border-radius: 6px;
  background: radial-gradient(circle at 25% 30%, rgba(255, 255, 255, .85) 0 2px, transparent 3px), radial-gradient(circle at 70% 22%, rgba(255, 255, 255, .8) 0 1.5px, transparent 3px), radial-gradient(circle at 60% 72%, rgba(255, 255, 255, .85) 0 2px, transparent 3px), radial-gradient(circle at 22% 78%, rgba(255, 255, 255, .7) 0 1.5px, transparent 3px),
  linear-gradient(145deg, rgba(220, 200, 255, .62), rgba(160, 120, 255, .45)); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .55); animation: dustglint 2.6s ease-in-out infinite; }
.dust.l2 { background-color: rgba(120, 60, 220, .3); box-shadow: inset 0 0 0 2.5px rgba(255, 255, 255, .85), inset 0 0 14px rgba(255, 255, 255, .6); }
@keyframes dustglint { 50% { filter: brightness(1.35); } }
.dust.gone { animation: dustgone .6s ease-out forwards; }
@keyframes dustgone { to { opacity: 0; transform: scale(1.5); filter: blur(4px) brightness(2); } }
.fx { position: absolute; pointer-events: none; z-index: 8; }
.spark { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--sc, #fff); box-shadow: 0 0 8px 2px var(--sc, #fff); animation: sparkfly .75s ease-out forwards; z-index: 9; pointer-events: none; }
@keyframes sparkfly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: 0; } }
.beam-h, .beam-v { position: absolute; z-index: 8; pointer-events: none; background: linear-gradient(90deg, transparent, #fff, #fff, transparent); box-shadow: 0 0 22px 8px rgba(255, 255, 255, .9); animation: beam .55s ease-out forwards; border-radius: 99px; }
.beam-v { background: linear-gradient(180deg, transparent, #fff, #fff, transparent); }
@keyframes beam { 0% { opacity: 0; transform: scale(.2, 1); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1, 1.8); } }
.beam-v { animation-name: beamv; } @keyframes beamv { 0% { opacity: 0; transform: scale(1, .2); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.8, 1.1); } }
.ring { position: absolute; z-index: 8; pointer-events: none; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 0 24px 8px rgba(255, 220, 120, .95), inset 0 0 20px rgba(255, 220, 120, .8); animation: ring .6s ease-out forwards; }

<body>
<div id="app">
  <div id="bgstars"></div>
  <section id="home" class="screen"></section>
  <section id="chapters" class="screen"></section>
  <section id="cards" class="screen"></section>
  <section id="game" class="screen"></section>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
/* ============================================================
   Once Upon a Match — game engine (pure logic, no DOM)
   ============================================================ */
(function (root) {
  'use strict';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const SP = { NONE: 0, ROW: 1, COL: 2, BOMB: 3, RAINBOW: 4 };
  let UID = 1;
  const mk = (t, sp, item) => ({ id: UID++, t: t, sp: sp || 0, item: !!item });
  const isColor = c => !!c && !c.item && c.t >= 0;

  const CHAPTER_LEVELS = 30;
  const WORLD_COUNT = 12;

  /* ---------------------------------------------------------
     Level definitions (endless, deterministic per level number)
     --------------------------------------------------------- */
  const KINDS = ['collect', 'score', 'collect2', 'collect', 'breather', 'dust', 'collect', 'items', 'dustcollect', 'boss'];

  function dustPattern(kind, rows, cols) {
    const out = [];
    const add = (r, c) => { if (r >= 0 && r < rows && c >= 0 && c < cols) out.push([r, c]); };
    switch (kind) {
      case 0: for (let c = 0; c < cols; c++) { add(rows - 1, c); add(rows - 2, c); } break;               // bottom band
      case 1: for (let r = 1; r < rows - 1; r++) for (let c = 0; c < cols; c++) if ((r + c) % 2 === 0) add(r, c); break; // checker
      case 2: { const cr = (rows - 1) / 2, cc = (cols - 1) / 2;
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (Math.abs(r - cr) + Math.abs(c - cc) <= 2.6) add(r, c); } break; // blob
      case 3: for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (r === 0 || c === 0 || r === rows - 1 || c === cols - 1) add(r, c); break; // ring
      case 4: for (let r = 0; r < rows; r++) { add(r, 1); add(r, cols - 2); } break;                       // two columns
      case 5: for (const r of [0, 1, rows - 2, rows - 1]) for (const c of [0, 1, cols - 2, cols - 1]) add(r, c); break; // corners
      default: for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (c === r || c === cols - 1 - r) add(r, c); break; // X
    }
    const seen = new Set(); const res = [];
    for (const p of out) { const k = p[0] * 100 + p[1]; if (!seen.has(k)) { seen.add(k); res.push(p); } }
    return res;
  }

  function makeLevel(n) {
    const rng = mulberry32(n * 9973 + 17);
    const R = (a, b) => a + Math.floor(rng() * (b - a + 1));
    const world = Math.floor((n - 1) / CHAPTER_LEVELS) % WORLD_COUNT;
    const local = ((n - 1) % CHAPTER_LEVELS) + 1;
    const cycle = Math.floor((n - 1) / (CHAPTER_LEVELS * WORLD_COUNT));
    const cols = n > 90 ? 7 : 6;
    const rows = n <= 40 ? 6 : 7;
    let ncol = n <= 5 ? 4 : 5;
    if (n >= 70 && n % 9 === 0) ncol = 6;
    const dustOK = n >= 12, itemsOK = n >= 22;

    let kind = KINDS[(n - 1) % 10];
    if (kind === 'dust' && !dustOK) kind = 'collect';
    if (kind === 'items' && !itemsOK) kind = 'score';
    if (kind === 'dustcollect' && !dustOK) kind = 'collect2';
    if (n <= 3) kind = n === 2 ? 'collect' : 'collect';
    if (kind === 'boss') {
      if (dustOK && itemsOK) kind = ['mix1', 'mix2', 'mix3'][R(0, 2)];
      else if (dustOK) kind = 'mix1';
      else kind = 'collect2';
    }

    const pickTile = (avoid) => { let t; let g = 0; do { t = R(0, ncol - 1); g++; } while (t === avoid && g < 20); return t; };
    const nn = Math.min(n, 100);
    let baseCount = Math.round(6 + 0.22 * nn + 0.035 * Math.max(0, n - 100));
    baseCount = Math.min(baseCount, 34);
    if (n <= 2) baseCount = n === 1 ? 6 : 8;
    const goals = [];
    let dust = [], items = [];
    let moves = 20;
    const breather = kind === 'breather';
    const f = breather ? 0.7 : 1;
    // gentle long-term ramp: levels slowly ask for a little more skill (never abrupt)
    const ramp = Math.max(0, Math.min(1, (n - 25) / 220));

    const addCollect = (tile, count) => goals.push({ type: 'collect', tile: tile, need: Math.max(4, Math.round(count)), have: 0 });
    const addScore = (target) => goals.push({ type: 'score', need: Math.round(target / 50) * 50, have: 0 });
    const addDust = (patternKind, layered) => {
      dust = dustPattern(patternKind, rows, cols).map(p => [p[0], p[1], layered && R(0, 2) === 0 ? 2 : 1]);
      const total = dust.reduce((a, d) => a + d[2], 0);
      goals.push({ type: 'dust', need: total, have: 0 });
    };
    const addItems = (k) => {
      const spots = k === 1 ? [Math.floor(cols / 2)] : k === 2 ? [1, cols - 2] : [1, Math.floor(cols / 2), cols - 2];
      items = spots.slice();
      goals.push({ type: 'items', need: k, have: 0 });
    };

    switch (kind) {
      case 'collect': { const t = pickTile(-1); addCollect(t, baseCount * f); moves = Math.round(baseCount * f * (1.2 - 0.62 * ramp) + 7 - 3 * ramp); break; }
      case 'breather': { const t = pickTile(-1); addCollect(t, baseCount * 0.7); moves = Math.round(baseCount * 0.7 * 1.3 + 9); break; }
      case 'collect2': { const a = pickTile(-1); const b = pickTile(a); addCollect(a, baseCount * 0.62); addCollect(b, baseCount * 0.62); moves = Math.round(baseCount * 1.25 * (1.2 - 0.6 * ramp) + 8 - 3 * ramp); break; }
      case 'score': { const target = 350 + n * 14; addScore(Math.min(target, 3200)); moves = Math.round(Math.min(target, 3200) / (45 + 45 * ramp) + 8); break; }
      case 'dust': { addDust(R(0, 6), n >= 100); moves = Math.round(goals[0].need * 1.35 + 11); break; }
      case 'dustcollect': { addDust(R(0, 6), n >= 100); const t = pickTile(-1); addCollect(t, baseCount * 0.5); moves = Math.round(goals[0].need * 1.1 + baseCount * 0.5 + 10); break; }
      case 'items': { const k = n >= 150 ? 3 : n >= 70 ? 2 : 1; addItems(k); moves = 17 + k * 8; break; }
      case 'mix1': { addDust(R(0, 6), n >= 100); const t = pickTile(-1); addCollect(t, baseCount * 0.55); moves = Math.round(goals[0].need * 1.2 + baseCount * 0.55 + 12); break; }
      case 'mix2': { addItems(n >= 90 ? 2 : 1); addScore(Math.min(300 + n * 9, 2200)); moves = 26 + goals[0].need * 6; break; }
      case 'mix3': { addItems(1); addDust(R(0, 6), false); moves = Math.round(goals[1].need * 1.25 + 22); break; }
      default: { const t = pickTile(-1); addCollect(t, baseCount); moves = Math.round(baseCount * 1.2 + 7); }
    }
    if (ncol === 6) moves += 4;
    if (n <= 5) moves += 5;
    // challenge curve: stays kind for the first levels, then asks for a bit more skill
    const tight = n <= 6 ? 1 : n <= 14 ? 1 - 0.26 * (n - 6) / 8 : 0.74 - 0.12 * Math.min(1, (n - 14) / 150);
    moves = Math.max(8, Math.round(moves * tight));

    return {
      n: n, world: world, local: local, cycle: cycle,
      cols: cols, rows: rows, ncol: ncol, moves: moves, kind: kind,
      goals: goals, dust: dust, items: items,
      wandUnlocked: n >= 6,
    };
  }

  /* ---------------------------------------------------------
     State
     --------------------------------------------------------- */
  const COMP_POWERS = ['row', 'burst', 'color'];

  function newRng() { return mulberry32((Math.random() * 4294967296) >>> 0); }

  function createState(level, opts) {
    opts = opts || {};
    const lr = mulberry32(level.n * 131 + 7 + (opts.layoutSalt || 0));
    const s = {
      n: level.n, cols: level.cols, rows: level.rows, ncol: level.ncol,
      grid: [], dust: [],
      goals: level.goals.map(g => Object.assign({}, g)),
      movesLeft: level.moves, movesTotal: level.moves, score: 0,
      wand: opts.wandStart ? 28 : 0, wandNeed: 28,
      charge: [0, 0, 0], chargeNeed: 10,
      compTile: opts.compTile || [0, 3, 4],
      extraMoves: 0,
    };
    s.rng = opts.rng || newRng();
    for (let attempt = 0; attempt < 30; attempt++) {
      s.grid = [];
      for (let r = 0; r < s.rows; r++) {
        s.grid.push([]);
        for (let c = 0; c < s.cols; c++) {
          let t, guard = 0;
          do {
            t = Math.floor(lr() * s.ncol); guard++;
          } while (guard < 40 && (
            (c >= 2 && s.grid[r][c - 1].t === t && s.grid[r][c - 2].t === t) ||
            (r >= 2 && s.grid[r - 1][c].t === t && s.grid[r - 2][c].t === t)));
          s.grid[r].push(mk(t));
        }
      }
      for (const c of level.items) s.grid[0][c] = mk(-1, 0, true);
      if (findRuns(s).length === 0 && listMoves(s).length > 0) break;
    }
    s.dust = [];
    for (let r = 0; r < s.rows; r++) s.dust.push(new Array(s.cols).fill(0));
    for (const d of level.dust) s.dust[d[0]][d[1]] = d[2];
    return s;
  }

  function serialize(s) {
    return JSON.parse(JSON.stringify(s, (k, v) => (k === 'rng' ? undefined : v)));
  }
  function deserialize(o) {
    const s = JSON.parse(JSON.stringify(o));
    s.rng = newRng();
    let max = 0;
    for (const row of s.grid) for (const c of row) if (c && c.id > max) max = c.id;
    if (max >= UID) UID = max + 1;
    return s;
  }

  function snapshot(s) {
    return s.grid.map(row => row.map(c => (c ? { id: c.id, t: c.t, sp: c.sp, item: c.item } : null)));
  }

  /* ---------------------------------------------------------
     Matching
     --------------------------------------------------------- */
  function findRuns(s) {
    const g = s.grid, rows = s.rows, cols = s.cols, runs = [];
    for (let r = 0; r < rows; r++) {
      let c = 0;
      while (c < cols) {
        const cell = g[r][c];
        if (!isColor(cell)) { c++; continue; }
        let e = c + 1;
        while (e < cols && isColor(g[r][e]) && g[r][e].t === cell.t) e++;
        if (e - c >= 3) runs.push({ dir: 'h', r: r, c: c, len: e - c, t: cell.t });
        c = e;
      }
    }
    for (let c = 0; c < cols; c++) {
      let r = 0;
      while (r < rows) {
        const cell = g[r][c];
        if (!isColor(cell)) { r++; continue; }
        let e = r + 1;
        while (e < rows && isColor(g[e][c]) && g[e][c].t === cell.t) e++;
        if (e - r >= 3) runs.push({ dir: 'v', r: r, c: c, len: e - r, t: cell.t });
        r = e;
      }
    }
    return runs;
  }

  function runCells(run) {
    const a = [];
    for (let i = 0; i < run.len; i++) a.push(run.dir === 'h' ? { r: run.r, c: run.c + i } : { r: run.r + i, c: run.c });
    return a;
  }

  function planCreations(s, runs, swapPos) {
    const hs = runs.filter(r => r.dir === 'h'), vs = runs.filter(r => r.dir === 'v');
    const used = new Set(); const out = []; const taken = new Set();
    const pref = run => {
      const cs = runCells(run).filter(q => s.grid[q.r][q.c] && s.grid[q.r][q.c].sp === 0 && !taken.has(q.r * 100 + q.c));
      if (!cs.length) return null;
      for (const p of (swapPos || [])) for (const q of cs) if (p.r === q.r && p.c === q.c) return q;
      return cs[Math.floor(cs.length / 2)];
    };
    for (const h of hs) for (const v of vs) {
      if (h.t !== v.t) continue;
      const r = h.r, c = v.c;
      if (c >= h.c && c < h.c + h.len && r >= v.r && r < v.r + v.len) {
        if (h.len >= 5 || v.len >= 5) continue;
        const cell = s.grid[r][c];
        if (cell && cell.sp === 0 && !taken.has(r * 100 + c)) {
          out.push({ r: r, c: c, sp: SP.BOMB, t: h.t }); taken.add(r * 100 + c); used.add(h); used.add(v);
        }
      }
    }
    for (const run of runs) {
      if (used.has(run) || run.len < 5) continue;
      const p = pref(run); if (!p) continue;
      out.push({ r: p.r, c: p.c, sp: SP.RAINBOW, t: -2 }); taken.add(p.r * 100 + p.c); used.add(run);
    }
    for (const run of runs) {
      if (used.has(run) || run.len !== 4) continue;
      const p = pref(run); if (!p) continue;
      out.push({ r: p.r, c: p.c, sp: run.dir === 'h' ? SP.COL : SP.ROW, t: run.t }); taken.add(p.r * 100 + p.c); used.add(run);
    }
    return out;
  }

  function mostCommonColor(s) {
    const cnt = new Array(8).fill(0);
    for (const row of s.grid) for (const c of row) if (isColor(c)) cnt[c.t]++;
    let best = 0;
    for (let i = 1; i < cnt.length; i++) if (cnt[i] > cnt[best]) best = i;
    return best;
  }

  /* ---------------------------------------------------------
     Clearing, gravity, refill
     --------------------------------------------------------- */
  function randomCell(s) {
    const w = [];
    for (let i = 0; i < s.ncol; i++) w.push(1);
    for (const g of s.goals) if (g.type === 'collect' && g.have < g.need && g.tile < s.ncol) w[g.tile] += 0.35;
    let tot = 0; for (const x of w) tot += x;
    let v = s.rng() * tot, t = 0;
    for (; t < w.length - 1; t++) { v -= w[t]; if (v < 0) break; }
    return mk(t);
  }

  function settle(s) {
    for (let c = 0; c < s.cols; c++) {
      const stack = [];
      for (let r = s.rows - 1; r >= 0; r--) if (s.grid[r][c]) stack.push(s.grid[r][c]);
      for (let r = s.rows - 1; r >= 0; r--) s.grid[r][c] = stack[s.rows - 1 - r] || null;
      for (let r = 0; r < s.rows; r++) if (!s.grid[r][c]) s.grid[r][c] = randomCell(s);
    }
  }

  function rescueItems(s, rescued) {
    let any = false;
    for (let c = 0; c < s.cols; c++) {
      const cell = s.grid[s.rows - 1][c];
      if (cell && cell.item) {
        rescued.push({ id: cell.id, r: s.rows - 1, c: c });
        s.grid[s.rows - 1][c] = null;
        for (const g of s.goals) if (g.type === 'items') g.have = Math.min(g.need, g.have + 1);
        s.score += 100;
        any = true;
      }
    }
    return any;
  }

  function clearCells(s, opt) {
    const rows = s.rows, cols = s.cols;
    const key = (r, c) => r * cols + c;
    const toClear = new Set();
    const handled = opt.handled || new Set();
    const fx = (opt.fx0 || []).slice();
    const runs = opt.runs || [];
    const creations = runs.length ? planCreations(s, runs, opt.swapPos) : [];
    const protect = new Set(creations.map(c => key(c.r, c.c)));
    const queue = [];

    function addCell(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      const cell = s.grid[r][c];
      if (!cell || cell.item) return;
      const k = key(r, c);
      if (toClear.has(k) || protect.has(k)) return;
      toClear.add(k);
      if (cell.sp > 0 && !handled.has(cell.id)) queue.push({ r: r, c: c, cell: cell });
    }

    for (const run of runs) for (const p of runCells(run)) addCell(p.r, p.c);
    if (opt.extra) for (const k of opt.extra) addCell(Math.floor(k / cols), k % cols);

    while (queue.length) {
      const q = queue.shift();
      handled.add(q.cell.id);
      if (q.cell.sp === SP.ROW) {
        fx.push({ type: 'row', r: q.r, c: q.c });
        for (let c = 0; c < cols; c++) addCell(q.r, c);
      } else if (q.cell.sp === SP.COL) {
        fx.push({ type: 'col', r: q.r, c: q.c });
        for (let r = 0; r < rows; r++) addCell(r, q.c);
      } else if (q.cell.sp === SP.BOMB) {
        fx.push({ type: 'bomb', r: q.r, c: q.c });
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (Math.abs(dr) + Math.abs(dc) <= 2) addCell(q.r + dr, q.c + dc);
      } else if (q.cell.sp === SP.RAINBOW) {
        const t = mostCommonColor(s);
        fx.push({ type: 'rainbow', r: q.r, c: q.c, t: t });
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const x = s.grid[r][c]; if (isColor(x) && x.t === t) addCell(r, c); }
      }
    }

    const removed = [], dustCleared = [];
    const mult = Math.min(opt.cascade || 1, 5);
    let gain = 0;
    const touch = (r, c) => {
      if (s.dust[r][c] > 0) {
        s.dust[r][c]--; dustCleared.push([r, c, s.dust[r][c]]);
        for (const g of s.goals) if (g.type === 'dust') g.have = Math.min(g.need, g.have + 1);
      }
    };
    for (const k of toClear) {
      const r = Math.floor(k / cols), c = k % cols;
      const cell = s.grid[r][c];
      removed.push({ id: cell.id, r: r, c: c, t: cell.t, sp: cell.sp });
      s.grid[r][c] = null;
      gain += 10 * mult;
      s.wand = Math.min(s.wandNeed, s.wand + 1);
      if (cell.t >= 0) {
        for (const g of s.goals) if (g.type === 'collect' && g.tile === cell.t) g.have = Math.min(g.need, g.have + 1);
        for (let i = 0; i < 3; i++) if (s.compTile[i] === cell.t) s.charge[i] = Math.min(s.chargeNeed, s.charge[i] + 1);
      }
      touch(r, c);
    }
    const created = [];
    for (const cr of creations) {
      const cell = s.grid[cr.r][cr.c];
      cell.sp = cr.sp; cell.t = cr.t;
      created.push({ id: cell.id, r: cr.r, c: cr.c, sp: cr.sp, t: cr.t });
      gain += cr.sp === SP.RAINBOW ? 60 : 30;
      touch(cr.r, cr.c);
    }
    s.score += gain;

    const rescued = [];
    do { settle(s); } while (rescueItems(s, rescued));
    for (const g of s.goals) if (g.type === 'score') g.have = s.score;

    return {
      type: 'clear', removed: removed, created: created, fx: fx, rescued: rescued, dustCleared: dustCleared,
      scoreGain: gain, cascade: opt.cascade || 1, grid: snapshot(s), score: s.score,
      goals: s.goals.map(g => Object.assign({}, g)), wand: s.wand, charge: s.charge.slice(),
    };
  }

  function runClears(s, first) {
    const steps = [];
    let cascade = 1;
    let opt = first;
    let runs = opt.runs || [];
    for (let guard = 0; guard < 60; guard++) {
      steps.push(clearCells(s, Object.assign({}, opt, { runs: runs, cascade: cascade })));
      cascade++;
      opt = {};
      runs = findRuns(s);
      if (!runs.length) break;
    }
    if (listMoves(s).length === 0) {
      reshuffle(s);
      steps.push({ type: 'shuffle', grid: snapshot(s), goals: s.goals.map(g => Object.assign({}, g)), score: s.score, wand: s.wand, charge: s.charge.slice() });
    }
    return steps;
  }

  function reshuffle(s) {
    const cells = [];
    for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) {
      const x = s.grid[r][c];
      if (x && !x.item && x.sp === 0 && x.t >= 0) cells.push({ r: r, c: c, x: x });
    }
    for (let attempt = 0; attempt < 200; attempt++) {
      const ts = cells.map(o => o.x.t);
      for (let i = ts.length - 1; i > 0; i--) { const j = Math.floor(s.rng() * (i + 1)); const tmp = ts[i]; ts[i] = ts[j]; ts[j] = tmp; }
      if (attempt > 120) for (let i = 0; i < ts.length; i++) ts[i] = Math.floor(s.rng() * s.ncol);
      cells.forEach((o, i) => { o.x.t = ts[i]; });
      if (findRuns(s).length === 0 && listMoves(s).length > 0) return true;
    }
    return false;
  }

  /* ---------------------------------------------------------
     Moves
     --------------------------------------------------------- */
  function moveInfo(s, a, b) {
    const ca = s.grid[a.r][a.c], cb = s.grid[b.r][b.c];
    if (!ca || !cb) return { valid: false };
    s.grid[a.r][a.c] = cb; s.grid[b.r][b.c] = ca;
    const runs = findRuns(s);
    s.grid[a.r][a.c] = ca; s.grid[b.r][b.c] = cb;
    const anyItem = ca.item || cb.item;
    const special = !anyItem && (ca.sp > 0 || cb.sp > 0);
    return { valid: special || runs.length > 0, runs: runs, special: special };
  }

  function listMoves(s) {
    const out = [];
    for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) {
      for (const d of [[0, 1], [1, 0]]) {
        const a = { r: r, c: c }, b = { r: r + d[0], c: c + d[1] };
        if (b.r >= s.rows || b.c >= s.cols) continue;
        const info = moveInfo(s, a, b);
        if (info.valid) out.push({ a: a, b: b, runs: info.runs, special: info.special });
      }
    }
    return out;
  }

  function swapMove(s, a, b) {
    const info = moveInfo(s, a, b);
    if (!info.valid || s.movesLeft <= 0) return { valid: false, steps: [] };
    const ca = s.grid[a.r][a.c], cb = s.grid[b.r][b.c];
    s.grid[a.r][a.c] = cb; s.grid[b.r][b.c] = ca;
    const key = (r, c) => r * s.cols + c;
    const x = cb, y = ca; // x now at a, y now at b
    const extra = new Set(), handled = new Set(), fx0 = [];
    const addColor = (t) => { for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) { const q = s.grid[r][c]; if (isColor(q) && q.t === t) extra.add(key(r, c)); } };
    if (info.special) {
      if (x.sp === SP.RAINBOW && y.sp === SP.RAINBOW) {
        handled.add(x.id); handled.add(y.id);
        extra.add(key(a.r, a.c)); extra.add(key(b.r, b.c));
        for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) if (s.grid[r][c] && !s.grid[r][c].item) extra.add(key(r, c));
        fx0.push({ type: 'rainbow', r: a.r, c: a.c, all: true });
      } else if (x.sp === SP.RAINBOW || y.sp === SP.RAINBOW) {
        const rain = x.sp === SP.RAINBOW ? x : y, rp = x.sp === SP.RAINBOW ? a : b, other = x.sp === SP.RAINBOW ? y : x;
        handled.add(rain.id); extra.add(key(rp.r, rp.c));
        addColor(other.t);
        fx0.push({ type: 'rainbow', r: rp.r, c: rp.c, t: other.t });
      } else {
        if (x.sp > 0) extra.add(key(a.r, a.c));
        if (y.sp > 0) extra.add(key(b.r, b.c));
      }
    }
    s.movesLeft--;
    const runs = findRuns(s);
    const steps = runClears(s, { runs: runs, extra: extra, swapPos: [a, b], fx0: fx0, handled: handled });
    return { valid: true, steps: steps };
  }

  function companionPower(s, idx, r, c) {
    const kind = COMP_POWERS[idx];
    const cell = s.grid[r][c];
    if (!cell) return { valid: false, steps: [] };
    const extra = new Set(); const key = (rr, cc) => rr * s.cols + cc;
    const fx0 = [];
    if (kind === 'row') {
      for (let cc = 0; cc < s.cols; cc++) extra.add(key(r, cc));
      fx0.push({ type: 'row', r: r, c: c, power: true });
    } else if (kind === 'burst') {
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (Math.abs(dr) + Math.abs(dc) <= 2) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < s.rows && cc >= 0 && cc < s.cols) extra.add(key(rr, cc));
      }
      fx0.push({ type: 'bomb', r: r, c: c, power: true });
    } else {
      if (cell.item) return { valid: false, steps: [] };
      const t = cell.t >= 0 ? cell.t : mostCommonColor(s);
      for (let rr = 0; rr < s.rows; rr++) for (let cc = 0; cc < s.cols; cc++) { const q = s.grid[rr][cc]; if (isColor(q) && q.t === t) extra.add(key(rr, cc)); }
      fx0.push({ type: 'rainbow', r: r, c: c, t: t, power: true });
    }
    s.charge[idx] = 0;
    return { valid: true, steps: runClears(s, { runs: [], extra: extra, fx0: fx0 }) };
  }

  function wandTargets(s) {
    const picks = []; const key = (r, c) => r * s.cols + c;
    const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(s.rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; };
    const open = s.goals.filter(g => g.type !== 'score' && g.have < g.need);
    const col = open.find(g => g.type === 'collect');
    if (col) {
      const cs = []; for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) { const q = s.grid[r][c]; if (isColor(q) && q.t === col.tile) cs.push(key(r, c)); }
      return shuffle(cs).slice(0, 9);
    }
    if (open.find(g => g.type === 'dust')) {
      const cs = []; for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) if (s.dust[r][c] > 0 && s.grid[r][c] && !s.grid[r][c].item) cs.push(key(r, c));
      return shuffle(cs).slice(0, 9);
    }
    if (open.find(g => g.type === 'items')) {
      const cs = [];
      for (let c = 0; c < s.cols; c++) for (let r = 0; r < s.rows; r++) if (s.grid[r][c] && s.grid[r][c].item) {
        for (let k = 1; k <= 3; k++) if (r + k < s.rows && s.grid[r + k][c] && !s.grid[r + k][c].item) cs.push(key(r + k, c));
      }
      return cs.slice(0, 9);
    }
    const all = []; for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) if (isColor(s.grid[r][c])) all.push(key(r, c));
    return shuffle(all).slice(0, 9);
  }

  function wandCast(s) {
    if (s.wand < s.wandNeed) return { valid: false, steps: [] };
    const picks = wandTargets(s);
    if (!picks.length) return { valid: false, steps: [] };
    s.wand = 0;
    const cells = picks.map(k => ({ r: Math.floor(k / s.cols), c: k % s.cols }));
    return { valid: true, steps: runClears(s, { runs: [], extra: new Set(picks), fx0: [{ type: 'wand', cells: cells }] }) };
  }

  /* bonus pops used for the end-of-level celebration */
  function bonusPop(s) {
    const cs = [];
    for (let r = 0; r < s.rows; r++) for (let c = 0; c < s.cols; c++) if (isColor(s.grid[r][c])) cs.push({ r: r, c: c });
    if (!cs.length) return { valid: false, steps: [] };
    const p = cs[Math.floor(s.rng() * cs.length)];
    const extra = new Set(); const key = (rr, cc) => rr * s.cols + cc;
    for (const d of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const rr = p.r + d[0], cc = p.c + d[1];
      if (rr >= 0 && rr < s.rows && cc >= 0 && cc < s.cols) extra.add(key(rr, cc));
    }
    return { valid: true, steps: runClears(s, { runs: [], extra: extra, fx0: [{ type: 'bonus', r: p.r, c: p.c }] }) };
  }

  /* ---------------------------------------------------------
     Status, stars, hints, bots
     --------------------------------------------------------- */
  function goalsDone(s) { return s.goals.every(g => (g.type === 'score' ? s.score : g.have) >= g.need); }
  function status(s) { if (goalsDone(s)) return 'won'; if (s.movesLeft <= 0) return 'lost'; return 'playing'; }
  function starsFor(s) {
    const f = s.movesLeft / s.movesTotal;
    return f >= 0.3 ? 3 : f >= 0.1 ? 2 : 1;
  }

  function scoreMove(s, m) {
    let v = 0;
    const seen = new Set();
    for (const run of m.runs) for (const p of runCells(run)) {
      const k = p.r * 100 + p.c; if (seen.has(k)) continue; seen.add(k);
      v += 1;
      const cell = s.grid[p.r][p.c];
      for (const g of s.goals) {
        if (g.have >= g.need && g.type !== 'score') continue;
        if (g.type === 'collect' && cell && cell.t === g.tile) v += 3;
        if (g.type === 'dust' && s.dust[p.r][p.c] > 0) v += 3;
        if (g.type === 'items') {
          for (let c = 0; c < s.cols; c++) for (let r = 0; r < s.rows; r++) { const it = s.grid[r][c]; if (it && it.item && c === p.c && p.r > r) v += 3; }
        }
      }
    }
    for (const run of m.runs) { if (run.len >= 4) v += 4; if (run.len >= 5) v += 6; }
    if (m.special) v += 5;
    return v;
  }

  function bestMove(s) {
    const ms = listMoves(s);
    if (!ms.length) return null;
    let best = null, bv = -1;
    for (const m of ms) { const v = scoreMove(s, m) + s.rng() * 0.5; if (v > bv) { bv = v; best = m; } }
    return best;
  }

  const Engine = {
    SP: SP, COMP_POWERS: COMP_POWERS, CHAPTER_LEVELS: CHAPTER_LEVELS, WORLD_COUNT: WORLD_COUNT,
    mulberry32: mulberry32, makeLevel: makeLevel, createState: createState,
    serialize: serialize, deserialize: deserialize, snapshot: snapshot,
    findRuns: findRuns, listMoves: listMoves, bestMove: bestMove, moveInfo: moveInfo,
    swapMove: swapMove, companionPower: companionPower, wandCast: wandCast, bonusPop: bonusPop,
    status: status, starsFor: starsFor, goalsDone: goalsDone, isColor: isColor,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

  "A mirror shows you a faraway home and someone you love who needs you. The Beast turns away and says, “Go. Your happiness matters more than mine.”",
  "You come back as the last petal trembles. Love, it turns out, was the spell’s only key. Light pours through the castle, and every candle cheers."

 "cinder": [
  "You sweep the hearth while the cinders dance. A little mouse peeks from a crack in the floor and squeaks that tonight the whole kingdom is going to a ball.",
  "Your stepsisters swish off in their silks. You sit alone among the ashes until a warm light fills the kitchen, and a fairy godmother twirls in with her wand.",
  "A pumpkin becomes a golden coach, the mice become white horses, and your rags turn into a gown that shimmers like moonlight. “Be home by midnight,” she smiles.",
  "The palace ballroom falls silent as you enter. The prince crosses the floor and asks for a dance, and you float as if the music were carrying you.",
  "The clock begins to strike twelve! You run down the steps and leave one glass slipper behind. The prince picks it up and promises to find you.",
  "He travels from house to house with the slipper in his hands. At last he reaches your door, and it fits like it was made for you. The bells ring all over the kingdom."
 ],
 "snow": [
  "Deep in the forest you find a tiny cottage with seven tiny beds. Seven tiny chairs wait at a tiny table. Somebody here is going to be very surprised.",
  "The seven dwarfs march home singing, and they find you asleep. Grumpy grumbles, Sleepy yawns, and Happy offers you the biggest slice of bread.",
  "A mirror far away says something the Queen does not like. A basket of red apples sets out through the trees, and your new friends warn you not to open the door.",
  "The little animals gather around you, and the birds bring you news. “Stay close,” chirps a bluebird. “A stranger is at the garden gate.”",
  "A single bite, and the whole forest goes still. The dwarfs gather round in tears and build you a glass bed among the flowers, and they will not leave.",
  "A prince rides by, and a gentle kiss breaks the spell. You wake to a hundred cheering birds, seven delighted dwarfs, and a morning that smells like apple blossoms."
 ],
 "mermaid": [
  "Far below the waves, coral towers glow in a hundred colors. A curious young mermaid swims up to you. “Have you seen the world above?” she asks. “I want to.”",
  "In a sunken ship she finds a fork, a pipe and a pocket watch, and a friendly seagull tells her what each one is called. The silly names make her laugh until her bubbles tickle.",
  "A great storm rolls overhead, and a ship tips into the sea. She swims through the waves and carries a young prince safely to shore, then slips away before he wakes.",
  "The sea witch’s cave is dark and curling, and her bargain is a clever one. “Your voice for legs,” she cackles. Your friend Flounder frets, but the mermaid has made up her mind.",
  "On land everything is new: sand, bread, and a prince who looks at her as if he has heard her song somewhere before. Even without a voice, her smile says plenty.",
  "At last the spell is undone, the sea sings again, and the whole ocean cheers. She learns that bravery and a kind heart make the best magic of all."
 ],
 "sleeping": [
  "A new princess is born, and the whole kingdom celebrates. Three tiny fairies arrive with gifts of beauty, song and kindness, and one of them is quietly fretting about a spindle.",
  "The princess grows up in a woodland cottage, singing with the animals. One day a young stranger hears her song and follows it, and she forgets everything else.",
  "At the castle, the spinning wheel waits in a tower. The princess climbs the winding stair, and the whole kingdom holds its breath.",
  "A hundred years of sleep settle over the castle. Thorns grow thick as walls, and the fairies keep watch, whispering that someone brave will come.",
  "A prince arrives at the brambles with only a sword and a hopeful heart. The thorns bend back as though they remember a promise, and a path opens.",
  "One gentle kiss, and the castle yawns awake. The clocks tick, the cooks stir, and the princess smiles down the stairs at the world she was meant to see."
 ],
 "hansel": [
  "Two children follow a trail of breadcrumbs, but the birds have eaten every one. The forest hums and the light gets low. “Stay close,” says Hansel, and Gretel takes his hand.",
  "Through the trees something glows. It’s a cottage built of gingerbread with gumdrop windows and a roof of icing! Your tummy rumbles, but a careful voice says, “Hmm, who lives here?”",
  "The old woman is not as sweet as her house. She locks Hansel in a cage and tells Gretel to scrub. Gretel smiles politely and starts thinking very hard.",
  "Gretel notices a loose key on a hook and a heavy oven door. Hansel pokes a bone through the bars, and the old woman’s eyes are too weak to tell.",
  "“Check if the oven is warm,” says the witch, but Gretel only looks confused. “Show me how,” she says, and a clever little push settles the matter.",
  "The cage opens, the gingerbread crumbles, and a chest of jewels spills out. Hansel and Gretel follow the swans home to a father who has been waiting by the door."
 ],
 "jack": [
  "Jack has traded the family cow for five little beans. His mother sighs, tosses them out the window, and goes to bed. By morning, a green stalk is climbing into the clouds.",
  "Up he goes, past the birds and the wind, until he steps onto a cloud as soft as cotton. A giant castle waits ahead, and its door is the size of a barn.",
  "The giant’s wife gives him a warm bun, and Jack tiptoes past the snoring giant. On the table is a bag of gold coins, which he carefully tucks under his arm.",
  "The next day a hen lays a golden egg right in front of him. It clucks happily when Jack picks her up, and he skips down the stalk.",
  "A golden harp is singing a lullaby. When Jack lifts it, it calls out, “Master!” and the giant wakes with a roar. Jack runs faster than he’s ever run.",
  "Down, down, down! Jack grabs the axe and chops, and the stalk crashes safely away. The giant stays in the clouds, and Jack’s mother hugs him all afternoon."
 ],
 "hood": [
  "Red Riding Hood sets out with a basket of warm bread for her grandmother. The path is lined with tulips. A songbird whistles, “Don’t stray, don’t stray!”",
  "Deep in the woods a wolf steps out, smiling. “Where are you going?” “To Grandmother’s,” she says, and the wolf races ahead by the shortest path.",
  "At the cottage the bed seems oddly lumpy. “What big ears you have!” says Red. “All the better to hear you with,” says a voice that is not quite Grandmother’s.",
  "A woodcutter hears her call and bursts in with his axe. The wolf is so startled that he jumps through the window and never looks back.",
  "Grandmother was only hiding in the wardrobe and bakes a plate of cookies to celebrate. Red Riding Hood laughs, and the woodcutter stays for tea.",
  "From then on, Red stays on the path, keeps her eyes open, and shares her basket with anyone who looks hungry, even a wolf that is learning to be polite."
 ],
 "alice": [
  "A white rabbit with a waistcoat hurries past, muttering that he’s late. You follow him down a rabbit hole, and the world tumbles gently upside down.",
  "A tiny door, a tiny key and a bottle that says DRINK ME. You shrink and shrink until the garden looks like a forest, and a caterpillar asks, “Who are you?”",
  "The Cheshire Cat’s grin appears first, then the cat. “We’re all mad here,” he purrs. “I’m mad, you’re mad.” You decide that makes tea parties much more fun.",
  "At the Mad Hatter’s party it is always six o’clock. The March Hare passes you a cup, and the Dormouse hums in his teapot. Nobody minds that the cake is a bit odd.",

 "aladdin": [
  "In the bustling market, Aladdin dodges the guards, shares a loaf with a hungry child, and meets a veiled girl who looks at the stars the way he does.",
  "A mysterious stranger sends him into a cave of treasure. “Touch nothing but the lamp,” he warns. A magic carpet waits and winks at him, and Aladdin follows.",
  "The lamp gives a puff of smoke, and out spins a Genie with a grin as big as the moon. “Three wishes! No wait, that’s too many. I mean, hello!”",
  "The Genie turns Aladdin into a prince, and a parade rolls through the city. But the princess smiles and says, “I liked you better before, honest and kind.”",
  "A sly vizier steals the lamp and wishes himself sultan. The carpet whisks Aladdin through the night sky, determined to put things right.",

 "rapunzel": [
  "In a tall tower with a single window, Rapunzel’s golden hair hangs down to the ground. She hums to the birds and paints the walls with flowers.",

  const WIN_TITLES = ['Splendid!', 'Enchanting!', 'Well done!', 'Wonderful!', 'Marvelous!', 'Happily Ever After!'];

<script>
/* ============================================================
   Once Upon a Match — synthesized sound (chimes + music box)
   ============================================================ */
(function (root) {
  'use strict';
  let ctx = null, master = null, sfxBus = null, musicBus = null, echo = null;
  let sfxOn = true, musicOn = true, musicTimer = null, step = 0, started = false;

  // C major pentatonic across octaves
  const NOTES = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98, 1760.0];
  const CHORDS = [
    [261.63, 329.63, 392.0, 493.88],  // Cmaj7
    [220.0, 261.63, 329.63, 392.0],   // Am7
    [174.61, 220.0, 261.63, 329.63],  // Fmaj7
    [196.0, 246.94, 293.66, 392.0],   // G6
  ];

  function init() {
    if (started) { if (ctx && ctx.state === 'suspended') ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.55; sfxBus.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
      // soft echo for the music
      echo = ctx.createDelay(1.0); echo.delayTime.value = 0.34;
      const fb = ctx.createGain(); fb.gain.value = 0.34;
      const wet = ctx.createGain(); wet.gain.value = 0.5;
      echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(musicBus);
      started = true;
      if (musicOn) startMusic();
    } catch (e) { /* audio is optional */ }
  }

  function tone(freq, t0, dur, type, gain, bus, detune) {
    if (!ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq; if (detune) o.detune.value = detune;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(bus || sfxBus);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) { /* ignore */ }
  }

  function bell(freq, t0, dur, gain, bus) {
    tone(freq, t0, dur, 'sine', gain, bus);
    tone(freq * 2.0, t0, dur * 0.6, 'sine', gain * 0.35, bus);
    tone(freq * 3.01, t0, dur * 0.3, 'sine', gain * 0.12, bus);
  }

  const sfx = {
    pop(cascade) {
      if (!sfxOn || !ctx) return;
      const i = Math.min(NOTES.length - 1, (cascade - 1) * 2 + Math.floor(Math.random() * 2));
      bell(NOTES[i], ctx.currentTime, 0.55, 0.22);
    },
    swap() { if (!sfxOn || !ctx) return; tone(380, ctx.currentTime, 0.09, 'triangle', 0.08); },
    nope() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; tone(220, t, 0.16, 'triangle', 0.14); tone(165, t + 0.1, 0.2, 'triangle', 0.12); },
    select() { if (!sfxOn || !ctx) return; tone(660, ctx.currentTime, 0.08, 'sine', 0.1); },
    special() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; [0, 1, 2, 3, 4].forEach(i => bell(NOTES[i + 2], t + i * 0.06, 0.6, 0.2)); },
    blast() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; tone(130, t, 0.35, 'triangle', 0.2); [5, 7, 9].forEach((n, i) => bell(NOTES[n], t + 0.05 + i * 0.05, 0.7, 0.16)); },
    charge() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; bell(NOTES[4], t, 0.5, 0.2); bell(NOTES[6], t + 0.12, 0.7, 0.2); },
    wand() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; for (let i = 0; i < 8; i++) bell(NOTES[Math.min(9, i + 2)], t + i * 0.055, 0.6, 0.15); },
    tap() { if (!sfxOn || !ctx) return; tone(520, ctx.currentTime, 0.07, 'sine', 0.1); },
    win() {
      if (!sfxOn || !ctx) return; const t = ctx.currentTime;
      [0, 2, 3, 5, 3, 5, 7, 9].forEach((n, i) => bell(NOTES[n], t + i * 0.13, 0.9, 0.2));
    },
    star() { if (!sfxOn || !ctx) return; bell(NOTES[7], ctx.currentTime, 0.8, 0.22); },
    lose() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; bell(NOTES[3], t, 0.9, 0.16); bell(NOTES[1], t + 0.22, 1.1, 0.16); },
    gift() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; [3, 5, 7, 8, 9].forEach((n, i) => bell(NOTES[n], t + i * 0.09, 0.9, 0.18)); },
    rescue() { if (!sfxOn || !ctx) return; const t = ctx.currentTime; [2, 4, 6].forEach((n, i) => bell(NOTES[n], t + i * 0.08, 0.7, 0.2)); },
  };

  function musicStep() {
    if (!ctx || !musicOn) return;
    if (document.hidden) { musicTimer = setTimeout(musicStep, 1000); return; }
    const t = ctx.currentTime + 0.05;
    const beat = step % 32;
    const chord = CHORDS[Math.floor(beat / 8) % 4];
    if (beat % 8 === 0) {
      // slow warm pad
      chord.forEach((f, i) => tone(f, t, 3.4, 'sine', 0.10, musicBus, i * 3));
      tone(chord[0] / 2, t, 3.6, 'sine', 0.12, musicBus);
    }
    // music-box arpeggio with a little variety
    const pat = [0, 2, 1, 3, 2, 3, 1, 2];
    if (beat % 2 === 0 || Math.random() < 0.35) {
      const idx = pat[beat % 8];
      const f = chord[idx % chord.length] * 2;
      const g = ctx.createGain(); g.gain.value = 0.7; g.connect(musicBus);
      bell(f, t, 1.4, 0.16, musicBus);
      try { const send = ctx.createGain(); send.gain.value = 0.5; send.connect(echo); bell(f, t, 1.0, 0.08, send); } catch (e) { /* ignore */ }
    }
    step++;
    musicTimer = setTimeout(musicStep, 520);
  }
  function startMusic() { if (!ctx) return; clearTimeout(musicTimer); musicTimer = setTimeout(musicStep, 300); }
  function stopMusic() { clearTimeout(musicTimer); musicTimer = null; }

  const Sound = {
    init: init, sfx: sfx,
    setSfx(v) { sfxOn = !!v; },
    setMusic(v) { musicOn = !!v; if (!ctx) return; if (musicOn) startMusic(); else stopMusic(); },
    get sfxOn() { return sfxOn; }, get musicOn() { return musicOn; },
  };
  root.Sound = Sound;
})(window);

  /* ---------- save data ---------- */
  const KEY = 'onceUponAMatch.v1';
  const defaults = () => ({ v: 1, name: '', top: 1, stars: {}, cards: [], lastGift: '', seen: {}, settings: { sfx: true, music: true, fs: 1, hints: true }, boost: { wand: false }, resume: null, wins: 0 });

      const o = JSON.parse(localStorage.getItem(KEY));

  const worldIdx = c => c % NW;
  function fogOrder(c) {

    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;

     HOME

      '<button id="h-set"><span>⚙️</span>Settings</button>' +

  function layoutBoard() {
    const L = G.level; if (!L) return;

    G.tiles.forEach(el => place(el, el._r, el._c, true));
    for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) { const d = G.dustEls[r] && G.dustEls[r][c]; if (d) d.style.transform = 'translate(' + (c * cell) + 'px,' + (r * cell) + 'px)'; }

  function place(el, r, c, instant, dur) {

  function tileLook(cell) {
    const w = G.world;
    if (cell.item) return { cls: 'gem item', inner: '<span>' + w.item.e + '</span>' };
    if (cell.sp === 4) return { cls: 'gem sp4', inner: '<span>✨</span>' };
    return { cls: 'gem c' + cell.t + (cell.sp ? ' sp' + cell.sp : ''), inner: '<span>' + w.tiles[cell.t].e + '</span>' + (cell.sp === 1 || cell.sp === 2 ? '<i class="mark"></i>' : '') };
  }
  function paintTile(el, cell) { const l = tileLook(cell), g = el.firstChild; g.className = l.cls; g.innerHTML = l.inner; el._sp = cell.sp; }
  function makeTile(cell) {
    const el = document.createElement('div'); el.className = 'tile'; el.innerHTML = '<div class="gem"></div>'; el._id = cell.id; paintTile(el, cell); return el;
  }
  function renderFull() {
    const L = G.level, s = G.state;
    layoutBoard();
    $('#tiles').innerHTML = ''; G.tiles.clear(); $('#dustlayer').innerHTML = ''; G.dustEls = [];
    for (let r = 0; r < L.rows; r++) {
      G.dustEls.push([]);

        const cell = s.grid[r][c];
        if (cell) { const el = makeTile(cell); $('#tiles').appendChild(el); G.tiles.set(cell.id, el); place(el, r, c, true); }
        if (s.dust[r][c] > 0) { const d = document.createElement('div'); d.className = 'dust' + (s.dust[r][c] > 1 ? ' l2' : ''); d.style.transform = 'translate(' + (c * G.cell) + 'px,' + (r * G.cell) + 'px)'; $('#dustlayer').appendChild(d); G.dustEls[r][c] = d; } else G.dustEls[r][c] = null;
      }

  function applySnapshot(grid, opts) {
    opts = opts || {};
    const L = G.level, present = new Set(); let maxDur = 0;
    for (let c = 0; c < L.cols; c++) {
      let k = 0; for (let r = 0; r < L.rows; r++) { const cell = grid[r][c]; if (cell && !G.tiles.has(cell.id)) k++; }
      for (let r = 0; r < L.rows; r++) {
        const cell = grid[r][c]; if (!cell) continue; present.add(cell.id);
        let el = G.tiles.get(cell.id);
        if (!el) {
          el = makeTile(cell); $('#tiles').appendChild(el); G.tiles.set(cell.id, el);
          place(el, r - k, c, true);
          const dur = Math.min(0.6, 0.2 + 0.07 * k); place(el, r, c, false, dur); maxDur = Math.max(maxDur, dur);
        } else {
          if (el._r !== r || el._c !== c) { const dist = Math.abs(r - el._r) + Math.abs(c - el._c); const dur = opts.shuffle ? 0.5 : Math.min(0.6, 0.18 + 0.07 * dist); place(el, r, c, false, dur); maxDur = Math.max(maxDur, dur); }
          if (el._sp !== cell.sp) { paintTile(el, cell); el.classList.add('born'); setTimeout(() => el.classList.remove('born'), 600); }
        }
      }
    }
    G.tiles.forEach((el, id) => { if (!present.has(id)) { el.remove(); G.tiles.delete(id); } });
    return maxDur;
  }
  const tileAt = p => { const cell = G.state.grid[p.r][p.c]; return cell ? G.tiles.get(cell.id) : null; };

  /* ---------- effects ---------- */
  function sparkBurst(x, y, color, n) {
    const layer = $('#fxlayer'); if (!layer) return;
    for (let i = 0; i < n; i++) {
      if (G.sparks > 90) return;
      const s = document.createElement('i'); s.className = 'spark'; G.sparks++;
      const a = Math.random() * 6.283, d = G.cell * (0.5 + Math.random() * 0.9);
      s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px'); s.style.setProperty('--sc', color || '#fff');
      layer.appendChild(s); setTimeout(() => { s.remove(); G.sparks--; }, 800);
    }
  }
  function floaty(x, y, text) {
    const f = document.createElement('div'); f.className = 'floaty'; f.textContent = text; f.style.left = x + 'px'; f.style.top = y + 'px'; $('#fxlayer').appendChild(f); setTimeout(() => f.remove(), 1050);
  }
  function showCheer(text) {
    const m = $('#board-msg'); m.classList.remove('show'); void m.offsetWidth; m.textContent = text; m.classList.add('show');
  }
  function flyGhost(emoji, x, y, chip) {
    if (!chip) return;
    const g = document.createElement('div'); g.className = 'fly'; g.textContent = emoji; g.style.left = x + 'px'; g.style.top = y + 'px'; document.body.appendChild(g);
    const r = chip.getBoundingClientRect(), tx = r.left + r.width / 2 - 12 - x, ty = r.top + r.height / 2 - 12 - y;
    const a = g.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + tx * 0.5 + 'px,' + (ty * 0.5 - 40) + 'px) scale(1.3)', opacity: 1, offset: 0.45 }, { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(.6)', opacity: 0.9 }], { duration: 650, easing: 'ease-in' });
    a.onfinish = () => { g.remove(); chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); };
  }
  function doFx(f) {
    const layer = $('#fxlayer'), L = G.level, c = G.cell; if (!layer) return;
    const add = (cls, css) => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; layer.appendChild(d); setTimeout(() => d.remove(), 800); };
    if (f.type === 'row') add('beam-h', 'left:0;width:' + (L.cols * c) + 'px;top:' + (f.r * c + c * 0.1) + 'px;height:' + (c * 0.8) + 'px');
    else if (f.type === 'col') add('beam-v', 'top:0;height:' + (L.rows * c) + 'px;left:' + (f.c * c + c * 0.1) + 'px;width:' + (c * 0.8) + 'px');
    else if (f.type === 'bomb') { const sz = c * 5; add('ring', 'width:' + sz + 'px;height:' + sz + 'px;left:' + ((f.c + 0.5) * c - sz / 2) + 'px;top:' + ((f.r + 0.5) * c - sz / 2) + 'px'); }
    else if (f.type === 'rainbow') { const sz = c * 7; add('ring rb', 'width:' + sz + 'px;height:' + sz + 'px;left:' + ((f.c + 0.5) * c - sz / 2) + 'px;top:' + ((f.r + 0.5) * c - sz / 2) + 'px'); }
    else if (f.type === 'bonus') { const sz = c * 3; add('ring', 'width:' + sz + 'px;height:' + sz + 'px;left:' + ((f.c + 0.5) * c - sz / 2) + 'px;top:' + ((f.r + 0.5) * c - sz / 2) + 'px'); }
    else if (f.type === 'wand') f.cells.forEach(p => sparkBurst((p.c + 0.5) * c, (p.r + 0.5) * c, '#ffe9a0', 9));
